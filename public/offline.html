<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tandem — нет сети</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #0e1116;
        color: #e6edf3;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 8px;
      }
      p {
        color: #9aa7b4;
        margin: 0 0 20px;
      }
      button {
        background: #58a6ff;
        color: #0e1116;
        border: 0;
        border-radius: 10px;
        padding: 10px 20px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" width="72" height="72" alt="" />
      <h1>Нет подключения</h1>
      <p>Tandem не может связаться с сервером. Проверьте интернет — сообщения отправятся, как только связь вернётся.</p>
      <button onclick="location.reload()">Повторить</button>
    </div>
  </body>
</html>
