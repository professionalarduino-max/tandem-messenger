name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Нужны для публикации артефакта в Pages через OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно крутится только один деплой, лишние запуски отменяем.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Проектный сайт лежит в подпапке /tandem-messenger/
          BASE_PATH: /tandem-messenger/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: SPA fallback
        # Pages отдаёт 404.html на любой неизвестный путь — пусть это будет само приложение
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
